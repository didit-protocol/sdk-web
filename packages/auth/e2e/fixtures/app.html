<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Didit Auth test page</title>
    <script type="importmap">
      { "imports": { "@didit-protocol/signals": "/signals.mjs" } }
    </script>
    <script>
      // Tests move this page's clock forward to reach the access token's expiry.
      const realNow = Date.now.bind(Date);
      Date.now = () => realNow() + (window.clockOffset || 0);
    </script>
  </head>
  <body>
    <script type="module">
      import { createDiditAuth, DiditAuthError } from "/dist/index.mjs";
      import { seededRandomValues } from "/seeded.mjs";

      // The page under test: the published build, driven by the specs through window.didit.
      window.didit = {
        createDiditAuth,
        DiditAuthError,
        events: [],
        // Draws the same random values as the recording of `scenario`, from `skip` bytes in: a second
        // tab of that recording continues where the first one stopped.
        seed(scenario, skip = 0) {
          // The recordings were made on a device that already had its id. Auth requests carry device
          // signals by default, and creating the id after this point would take random values out of
          // the seeded sequence that the recorded PKCE values come from.
          if (!localStorage.getItem("didit-pid-v1")) {
            const bytes = crypto.getRandomValues(new Uint8Array(16));
            const id = btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
            localStorage.setItem("didit-pid-v1", id);
          }
          crypto.getRandomValues = seededRandomValues(scenario);
          crypto.getRandomValues(new Uint8Array(skip));
        },
        create(options) {
          window.auth = createDiditAuth(options);
          window.auth.onAuthStateChange((event, session) => window.didit.events.push([event, session && session.email]));
          return true;
        }
      };
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
