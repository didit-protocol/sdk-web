<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Bank Link frame stub</title>
    <link rel="stylesheet" href="/e2e/fixtures/colors_and_type.css">
    <style>
      body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #fff; color: #111; }
      @media (prefers-color-scheme: dark) { body { background: #0b0b0d; color: #f3f3f3; } }
      button { margin: 4px 4px 0 0; padding: 8px 12px; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!-- A stand-in for the hosted Bank Link frame that speaks the wire contract of the SDK
         (didit:bank_link:* messages, version 1). It reads the fragment, answers only the
         exact parent origin and only its parent window, and records what it was sent. -->
    <h1>Connect your bank</h1>
    <div>
      <button id="open-bank">Continue to your bank</button>
      <button id="redirect">Continue on this page</button>
      <button id="complete">Finish</button>
      <button id="fail">Fail</button>
      <button id="close">Close</button>
    </div>
    <pre id="log"></pre>
    <script>
      const params = new URLSearchParams(location.hash.slice(1));
      const parentOrigin = params.get("parent_origin");
      const linkRef = "stub-link-ref";
      const received = [];
      window.received = received;
      window.fragment = Object.fromEntries(params);
      window.referrerSeen = document.referrer;
      // The token never stays in the address bar.
      history.replaceState(null, "", location.pathname);

      function post(type, data) {
        window.parent.postMessage({ type: `didit:bank_link:${type}`, v: 1, data, timestamp: Date.now(), link_ref: linkRef }, parentOrigin);
      }

      window.addEventListener("message", (event) => {
        if (event.origin !== parentOrigin || event.source !== window.parent) return;
        received.push(event.data);
        document.getElementById("log").textContent = JSON.stringify(received, null, 2);
        const data = event.data?.data ?? {};
        if (event.data?.type === "didit:bank_link:popup_state" && data.state === "opened") {
          post("bank_redirect", { via: "popup" });
          post("bank_url", { request_id: data.request_id, url: "https://bank.example/auth" });
        }
        if (event.data?.type === "didit:bank_link:popup_state" && data.state === "blocked") {
          post("redirect_request", { request_id: data.request_id, resume_code: "rsc_stubresume0001.c2VjcmV0X3ZhbHVl" });
        }
      });

      // The hosted flow reports its layout as it does for verification, so the modal sizes to it.
      window.parent.postMessage({ type: "didit:layout", data: { contentHeight: 640, colorScheme: window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light", kind: "step" }, timestamp: Date.now() }, parentOrigin);

      const resuming = params.get("resume") === "1";
      post("opened", { link_id: "11111111-1111-4111-8111-111111111111", mode: "connect", access: "ongoing", presentation: params.get("presentation") });
      if (resuming) {
        post("success", { link_id: "11111111-1111-4111-8111-111111111111", connection_id: "22222222-2222-4222-8222-222222222222", check_id: null });
      }
      document.getElementById("open-bank").onclick = () => post("open_bank", { request_id: "req-1" });
      document.getElementById("redirect").onclick = () => post("redirect_request", { request_id: "req-2", resume_code: "rsc_stubresume0001.c2VjcmV0X3ZhbHVl" });
      document.getElementById("complete").onclick = () =>
        post("success", { link_id: "11111111-1111-4111-8111-111111111111", connection_id: "22222222-2222-4222-8222-222222222222", check_id: null });
      document.getElementById("fail").onclick = () => post("exit", { reason: "failed", step: "bank_hop" });
      document.getElementById("close").onclick = () => post("close_request", {});
    </script>
  </body>
</html>
