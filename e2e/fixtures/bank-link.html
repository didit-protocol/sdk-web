<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bank Link SDK fixture</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 24px; }
      #bank { width: min(520px, 100%); height: 420px; border: 1px dashed #999; margin-top: 16px; }
    </style>
  </head>
  <body>
    <button id="open-modal">Open modal</button>
    <button id="open-inline">Open inline</button>
    <div id="bank"></div>
    <script type="module">
      import { DiditSdk } from "../../dist/didit-sdk.esm.js";

      // What the integrator's page observes, in order.
      window.records = { events: [], success: [], exit: [], resume: null };
      // The hosted page is a stub served from another origin (localhost, not 127.0.0.1).
      const baseUrl = new URLSearchParams(location.search).get("base") ?? "http://localhost:4173";
      const token = "blt_0123456789abcdefghij";
      const callbacks = {
        onEvent: (event) => window.records.events.push(event),
        onSuccess: (result) => window.records.success.push(result),
        onExit: (result) => window.records.exit.push(result)
      };

      window.openModal = () => DiditSdk.shared.openBankLink({ token, baseUrl, ...callbacks });
      window.openInline = () => DiditSdk.shared.openBankLink({ token, baseUrl, container: "#bank", ...callbacks });
      document.getElementById("open-modal").onclick = window.openModal;
      document.getElementById("open-inline").onclick = window.openInline;

      // Safe on every page load: it only acts on the page a redirect returned to.
      DiditSdk.shared.resumeBankLink({ baseUrl, ...callbacks }).then((result) => (window.records.resume = result));
    </script>
  </body>
</html>
